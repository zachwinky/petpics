<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b0bec5"/>
      <stop offset="100%" stop-color="#cfd8dc"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Desk -->
  <rect x="60" y="230" width="280" height="15" rx="3" fill="#795548" opacity="0.5"/>
  <!-- Monitor -->
  <rect x="150" y="140" width="100" height="75" rx="5" fill="#333" opacity="0.6"/>
  <rect x="155" y="145" width="90" height="60" rx="3" fill="#5b8dd9" opacity="0.3"/>
  <rect x="185" y="215" width="30" height="15" fill="#444" opacity="0.4"/>
  <!-- Keyboard -->
  <rect x="140" y="245" width="80" height="15" rx="3" fill="#444" opacity="0.4"/>
  <!-- Coffee mug -->
  <rect x="260" y="210" width="20" height="22" rx="3" fill="#fff" opacity="0.5"/>
  <rect x="278" y="215" width="8" height="12" rx="4" fill="none" stroke="#fff" stroke-width="2" opacity="0.4"/>
  <!-- Glasses -->
  <circle cx="180" cy="180" r="10" fill="none" stroke="#333" stroke-width="2" opacity="0.4"/>
  <circle cx="210" cy="180" r="10" fill="none" stroke="#333" stroke-width="2" opacity="0.4"/>
  <line x1="190" y1="180" x2="200" y2="180" stroke="#333" stroke-width="2" opacity="0.4"/>
  <text x="200" y="370" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#546e7a" opacity="0.7">Office Worker</text>
</svg>
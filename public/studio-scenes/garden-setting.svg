<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#81c784"/>
      <stop offset="40%" stop-color="#a5d6a7"/>
      <stop offset="70%" stop-color="#f8bbd0"/>
      <stop offset="100%" stop-color="#f48fb1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Garden ground -->
  <path d="M0 280 Q100 272 200 278 Q300 284 400 275 L400 400 L0 400 Z" fill="#4caf50" opacity="0.3"/>
  <!-- Garden fence -->
  <line x1="30" y1="255" x2="370" y2="255" stroke="#8d6e63" stroke-width="3" opacity="0.35"/>
  <line x1="30" y1="270" x2="370" y2="270" stroke="#8d6e63" stroke-width="3" opacity="0.35"/>
  <line x1="50" y1="240" x2="50" y2="280" stroke="#8d6e63" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
  <line x1="90" y1="240" x2="90" y2="280" stroke="#8d6e63" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
  <line x1="130" y1="240" x2="130" y2="280" stroke="#8d6e63" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
  <line x1="270" y1="240" x2="270" y2="280" stroke="#8d6e63" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
  <line x1="310" y1="240" x2="310" y2="280" stroke="#8d6e63" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
  <line x1="350" y1="240" x2="350" y2="280" stroke="#8d6e63" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
  <!-- Garden arch -->
  <path d="M160 280 Q160 210 200 195 Q240 210 240 280" fill="none" stroke="#8d6e63" stroke-width="4" opacity="0.4"/>
  <!-- Climbing flowers on arch -->
  <circle cx="165" cy="240" r="4" fill="#e91e63" opacity="0.5"/>
  <circle cx="170" cy="220" r="3.5" fill="#f06292" opacity="0.45"/>
  <circle cx="175" cy="205" r="4" fill="#ec407a" opacity="0.5"/>
  <circle cx="235" cy="240" r="4" fill="#e91e63" opacity="0.5"/>
  <circle cx="230" cy="220" r="3.5" fill="#f06292" opacity="0.45"/>
  <circle cx="225" cy="205" r="4" fill="#ec407a" opacity="0.5"/>
  <circle cx="200" cy="195" r="4" fill="#ad1457" opacity="0.5"/>
  <!-- Flower stems in garden -->
  <line x1="70" y1="250" x2="70" y2="190" stroke="#388e3c" stroke-width="2" opacity="0.5"/>
  <line x1="110" y1="252" x2="110" y2="175" stroke="#388e3c" stroke-width="2" opacity="0.5"/>
  <line x1="290" y1="250" x2="290" y2="185" stroke="#388e3c" stroke-width="2" opacity="0.5"/>
  <line x1="330" y1="252" x2="330" y2="195" stroke="#388e3c" stroke-width="2" opacity="0.5"/>
  <!-- Tulip-style flowers -->
  <g transform="translate(70,185)" opacity="0.7">
    <path d="M0 0 Q-6 -10 0 -15 Q6 -10 0 0" fill="#e91e63"/>
  </g>
  <g transform="translate(110,170)" opacity="0.75">
    <path d="M0 0 Q-7 -12 0 -18 Q7 -12 0 0" fill="#f44336"/>
  </g>
  <g transform="translate(290,180)" opacity="0.7">
    <path d="M0 0 Q-6 -10 0 -15 Q6 -10 0 0" fill="#ff5722"/>
  </g>
  <g transform="translate(330,190)" opacity="0.65">
    <path d="M0 0 Q-6 -10 0 -15 Q6 -10 0 0" fill="#e91e63"/>
  </g>
  <!-- Butterfly -->
  <g transform="translate(250,140) scale(0.8)" opacity="0.5">
    <ellipse cx="-8" cy="-5" rx="8" ry="6" fill="#ce93d8" transform="rotate(-20 -8 -5)"/>
    <ellipse cx="8" cy="-5" rx="8" ry="6" fill="#ce93d8" transform="rotate(20 8 -5)"/>
    <ellipse cx="-5" cy="3" rx="5" ry="4" fill="#ba68c8" transform="rotate(-15 -5 3)"/>
    <ellipse cx="5" cy="3" rx="5" ry="4" fill="#ba68c8" transform="rotate(15 5 3)"/>
    <line x1="0" y1="0" x2="0" y2="8" stroke="#6a1b9a" stroke-width="1.5"/>
  </g>
  <!-- Scattered leaves -->
  <ellipse cx="180" cy="310" rx="5" ry="3" fill="#66bb6a" opacity="0.3" transform="rotate(30 180 310)"/>
  <ellipse cx="220" cy="320" rx="4" ry="2.5" fill="#81c784" opacity="0.25" transform="rotate(-20 220 320)"/>
  <!-- Label -->
  <text x="200" y="370" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#2e7d32" opacity="0.7">Garden Setting</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Easel -->
  <line x1="160" y1="120" x2="140" y2="300" stroke="#795548" stroke-width="4" opacity="0.5"/>
  <line x1="240" y1="120" x2="260" y2="300" stroke="#795548" stroke-width="4" opacity="0.5"/>
  <line x1="200" y1="120" x2="200" y2="310" stroke="#795548" stroke-width="3" opacity="0.4"/>
  <!-- Canvas -->
  <rect x="150" y="115" width="100" height="80" rx="2" fill="white" opacity="0.7"/>
  <!-- Paint splotches on canvas -->
  <circle cx="175" cy="145" r="10" fill="#e74c3c" opacity="0.4"/>
  <circle cx="210" cy="135" r="8" fill="#2196f3" opacity="0.4"/>
  <circle cx="195" cy="165" r="12" fill="#ffeb3b" opacity="0.4"/>
  <circle cx="230" cy="160" r="7" fill="#4caf50" opacity="0.4"/>
  <!-- Beret -->
  <ellipse cx="200" cy="80" rx="25" ry="12" fill="#333" opacity="0.4"/>
  <!-- Palette -->
  <ellipse cx="290" cy="210" rx="30" ry="20" fill="#8d6e63" opacity="0.4" transform="rotate(-15 290 210)"/>
  <circle cx="280" cy="205" r="4" fill="#e74c3c" opacity="0.5"/>
  <circle cx="295" cy="200" r="4" fill="#2196f3" opacity="0.5"/>
  <circle cx="300" cy="215" r="4" fill="#ffeb3b" opacity="0.5"/>
  <text x="200" y="370" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#8d6e63" opacity="0.7">Artist</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c2c54"/>
      <stop offset="100%" stop-color="#474787"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Bed/headboard -->
  <rect x="80" y="160" width="240" height="20" rx="5" fill="#5d4037" opacity="0.5"/>
  <!-- Pillows -->
  <ellipse cx="150" cy="195" rx="40" ry="18" fill="white" opacity="0.3"/>
  <ellipse cx="250" cy="195" rx="40" ry="18" fill="white" opacity="0.3"/>
  <!-- Blanket -->
  <rect x="80" y="210" width="240" height="80" rx="8" fill="#7986cb" opacity="0.3"/>
  <!-- Lamp on nightstand -->
  <rect x="310" y="170" width="30" height="40" rx="3" fill="#5d4037" opacity="0.3"/>
  <rect x="317" y="150" width="16" height="20" rx="8" fill="#ffeb3b" opacity="0.2"/>
  <circle cx="325" cy="155" r="12" fill="#ffeb3b" opacity="0.1"/>
  <!-- Reading glasses -->
  <circle cx="185" cy="230" r="8" fill="none" stroke="#ccc" stroke-width="1.5" opacity="0.3"/>
  <circle cx="210" cy="230" r="8" fill="none" stroke="#ccc" stroke-width="1.5" opacity="0.3"/>
  <line x1="193" y1="230" x2="202" y2="230" stroke="#ccc" stroke-width="1.5" opacity="0.3"/>
  <!-- Book -->
  <rect x="130" y="240" width="30" height="22" rx="2" fill="#e8d5b7" opacity="0.3" transform="rotate(-10 145 251)"/>
  <text x="200" y="370" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#b39ddb" opacity="0.7">Cozy Bedtime</text>
</svg>
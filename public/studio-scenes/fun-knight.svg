<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3e2723"/>
      <stop offset="100%" stop-color="#5d4037"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Stone wall -->
  <rect x="0" y="0" width="400" height="400" fill="#4e342e" opacity="0.2"/>
  <line x1="0" y1="80" x2="400" y2="80" stroke="#3e2723" stroke-width="1" opacity="0.2"/>
  <line x1="0" y1="160" x2="400" y2="160" stroke="#3e2723" stroke-width="1" opacity="0.2"/>
  <line x1="0" y1="240" x2="400" y2="240" stroke="#3e2723" stroke-width="1" opacity="0.2"/>
  <!-- Torch glow -->
  <circle cx="80" cy="150" r="40" fill="#ff9800" opacity="0.1"/>
  <circle cx="320" cy="150" r="40" fill="#ff9800" opacity="0.1"/>
  <!-- Torch -->
  <rect x="76" y="150" width="8" height="40" fill="#5d4037" opacity="0.5"/>
  <ellipse cx="80" cy="148" rx="6" ry="10" fill="#ff9800" opacity="0.4"/>
  <rect x="316" y="150" width="8" height="40" fill="#5d4037" opacity="0.5"/>
  <ellipse cx="320" cy="148" rx="6" ry="10" fill="#ff9800" opacity="0.4"/>
  <!-- Helmet -->
  <rect x="180" y="100" width="40" height="50" rx="5" fill="#9e9e9e" opacity="0.5"/>
  <rect x="185" y="120" width="30" height="8" rx="2" fill="#333" opacity="0.3"/>
  <rect x="190" y="90" width="20" height="15" rx="8" fill="#9e9e9e" opacity="0.4"/>
  <!-- Sword -->
  <rect x="248" y="80" width="4" height="120" fill="#bdbdbd" opacity="0.5"/>
  <rect x="238" y="195" width="24" height="6" rx="2" fill="#8d6e63" opacity="0.5"/>
  <rect x="246" y="200" width="8" height="20" rx="2" fill="#5d4037" opacity="0.4"/>
  <!-- Shield -->
  <path d="M140 170 L140 230 Q140 260 170 270 Q200 260 200 230 L200 170Z" fill="#1565c0" opacity="0.3" stroke="#bdbdbd" stroke-width="2" />
  <line x1="170" y1="175" x2="170" y2="265" stroke="#bdbdbd" stroke-width="1" opacity="0.3"/>
  <line x1="140" y1="215" x2="200" y2="215" stroke="#bdbdbd" stroke-width="1" opacity="0.3"/>
  <text x="200" y="370" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#bdbdbd" opacity="0.7">Medieval Knight</text>
</svg>
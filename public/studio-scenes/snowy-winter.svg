<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#90caf9"/>
      <stop offset="50%" stop-color="#bbdefb"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Snow ground -->
  <path d="M0 300 Q50 290 100 295 Q150 300 200 292 Q250 284 300 295 Q350 306 400 295 L400 400 L0 400 Z" fill="#ffffff" opacity="0.7"/>
  <path d="M0 320 Q80 310 160 315 Q240 320 320 312 Q360 308 400 315 L400 400 L0 400 Z" fill="#ffffff" opacity="0.85"/>
  <!-- Snowflake center -->
  <g transform="translate(200,170)" stroke="#1565c0" stroke-width="2.5" stroke-linecap="round" opacity="0.5">
    <!-- Main arms -->
    <line x1="0" y1="-40" x2="0" y2="40"/>
    <line x1="-34.6" y1="-20" x2="34.6" y2="20"/>
    <line x1="-34.6" y1="20" x2="34.6" y2="-20"/>
    <!-- Branch details -->
    <line x1="0" y1="-25" x2="-8" y2="-33"/>
    <line x1="0" y1="-25" x2="8" y2="-33"/>
    <line x1="0" y1="25" x2="-8" y2="33"/>
    <line x1="0" y1="25" x2="8" y2="33"/>
    <line x1="-21.6" y1="-12.5" x2="-27" y2="-22"/>
    <line x1="-21.6" y1="-12.5" x2="-29.6" y2="-8"/>
    <line x1="21.6" y1="12.5" x2="27" y2="22"/>
    <line x1="21.6" y1="12.5" x2="29.6" y2="8"/>
    <line x1="-21.6" y1="12.5" x2="-29.6" y2="8"/>
    <line x1="-21.6" y1="12.5" x2="-27" y2="22"/>
    <line x1="21.6" y1="-12.5" x2="29.6" y2="-8"/>
    <line x1="21.6" y1="-12.5" x2="27" y2="-22"/>
  </g>
  <!-- Small floating snowflakes -->
  <circle cx="80" cy="100" r="3" fill="#ffffff" opacity="0.7"/>
  <circle cx="320" cy="80" r="2.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="60" cy="200" r="2" fill="#ffffff" opacity="0.5"/>
  <circle cx="340" cy="180" r="3" fill="#ffffff" opacity="0.65"/>
  <circle cx="140" cy="70" r="2" fill="#ffffff" opacity="0.5"/>
  <circle cx="260" cy="250" r="2.5" fill="#ffffff" opacity="0.55"/>
  <circle cx="100" cy="270" r="2" fill="#ffffff" opacity="0.45"/>
  <circle cx="300" cy="260" r="1.5" fill="#ffffff" opacity="0.5"/>
  <circle cx="50" cy="150" r="1.5" fill="#ffffff" opacity="0.4"/>
  <circle cx="350" cy="130" r="2" fill="#ffffff" opacity="0.5"/>
  <circle cx="180" cy="90" r="2.5" fill="#ffffff" opacity="0.55"/>
  <circle cx="230" cy="280" r="2" fill="#ffffff" opacity="0.45"/>
  <!-- Small snowflake accents -->
  <g transform="translate(80,100) scale(0.3)" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.4">
    <line x1="0" y1="-12" x2="0" y2="12"/>
    <line x1="-10.4" y1="-6" x2="10.4" y2="6"/>
    <line x1="-10.4" y1="6" x2="10.4" y2="-6"/>
  </g>
  <g transform="translate(320,80) scale(0.25)" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.35">
    <line x1="0" y1="-12" x2="0" y2="12"/>
    <line x1="-10.4" y1="-6" x2="10.4" y2="6"/>
    <line x1="-10.4" y1="6" x2="10.4" y2="-6"/>
  </g>
  <!-- Label -->
  <text x="200" y="370" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#1565c0" opacity="0.6">Snowy Winter</text>
</svg>
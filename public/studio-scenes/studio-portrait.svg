<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9e9e9e"/>
      <stop offset="50%" stop-color="#d4d4d4"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <rect width="400" height="400" fill="url(#spotlight)"/>
  <!-- Camera body -->
  <rect x="145" y="140" width="110" height="80" rx="12" fill="#4a4a4a" opacity="0.8"/>
  <!-- Lens -->
  <circle cx="200" cy="175" r="30" fill="#333" opacity="0.9"/>
  <circle cx="200" cy="175" r="22" fill="#555" opacity="0.8"/>
  <circle cx="200" cy="175" r="14" fill="#2a2a2a" opacity="0.9"/>
  <circle cx="200" cy="170" r="5" fill="#6a8caf" opacity="0.6"/>
  <!-- Flash -->
  <rect x="160" y="130" width="30" height="14" rx="3" fill="#555" opacity="0.7"/>
  <!-- Viewfinder -->
  <rect x="220" y="145" width="20" height="12" rx="2" fill="#555" opacity="0.7"/>
  <!-- Tripod lines -->
  <line x1="200" y1="220" x2="160" y2="290" stroke="#4a4a4a" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="200" y1="220" x2="200" y2="295" stroke="#4a4a4a" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="200" y1="220" x2="240" y2="290" stroke="#4a4a4a" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <!-- Label -->
  <text x="200" y="370" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#555" opacity="0.7">Studio Portrait</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Spotlights -->
  <circle cx="100" cy="50" r="60" fill="#ff6600" opacity="0.1"/>
  <circle cx="300" cy="50" r="60" fill="#ff00ff" opacity="0.1"/>
  <circle cx="200" cy="30" r="50" fill="#ffeb3b" opacity="0.08"/>
  <!-- Stage -->
  <rect x="0" y="300" width="400" height="100" fill="#333" opacity="0.4"/>
  <!-- Guitar body -->
  <ellipse cx="200" cy="210" rx="30" ry="40" fill="#8b4513" opacity="0.5"/>
  <ellipse cx="200" cy="175" rx="25" ry="30" fill="#8b4513" opacity="0.4"/>
  <!-- Guitar neck -->
  <rect x="195" y="100" width="10" height="80" fill="#5d4037" opacity="0.5"/>
  <!-- Strings -->
  <line x1="198" y1="100" x2="198" y2="240" stroke="#ccc" stroke-width="0.5" opacity="0.3"/>
  <line x1="202" y1="100" x2="202" y2="240" stroke="#ccc" stroke-width="0.5" opacity="0.3"/>
  <!-- Sunglasses -->
  <rect x="172" y="130" width="22" height="12" rx="3" fill="#111" opacity="0.5"/>
  <rect x="206" y="130" width="22" height="12" rx="3" fill="#111" opacity="0.5"/>
  <line x1="194" y1="136" x2="206" y2="136" stroke="#333" stroke-width="2" opacity="0.4"/>
  <text x="200" y="370" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#ff9800" opacity="0.7">Rockstar</text>
</svg>